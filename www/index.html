<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c4cf5" data-light="#6c4cf5" data-dark="#3b2a8f">
  <script src="theme.js"></script>
  <meta name="description" content="رحلة العودة للدراسة: تحديات يومية، نقاط ومستويات، مؤقت تركيز وألعاب ذهنية لتحفيز الطالب.">
  <title>رحلة العودة</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚀 <span class="brand-text">رحلة العودة</span></div>
    <div class="top-stats">
      <button type="button" class="pill" id="streakPill" data-action="streakSheet">🔥 0</button>
      <span class="pill" id="xpPill" title="نقاطك">⭐ 0</span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع"><span class="ico" aria-hidden="true">🌙</span></button>
      <button class="icon-btn" id="settingsBtn" type="button" data-action="openSettings" aria-label="الإعدادات" title="الإعدادات"><span class="ico" aria-hidden="true">⚙️</span></button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" id="nav" aria-label="التنقل الرئيسي">
    <button data-view="home" class="active"><span aria-hidden="true">🏠</span>الرئيسية</button>
    <button data-view="challenges"><span aria-hidden="true">🎯</span>التحديات</button>
    <button data-view="focus"><span aria-hidden="true">⏱️</span>تركيز</button>
    <button data-view="cards"><span aria-hidden="true">🗂️</span>بطاقاتي</button>
    <button data-view="journey"><span aria-hidden="true">🗺️</span>رحلتي</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody"><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
