<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c4cf5" data-light="#6c4cf5" data-dark="#3b2a8f">
  <script src="theme.js"></script>
  <meta name="description" content="رحلة العودة للدراسة: تحديات يومية، نقاط ومستويات، مؤقت تركيز وألعاب ذهنية لتحفيز الطالب.">
  <title>رحلة العودة</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚀 رحلة العودة</div>
    <div class="top-stats">
      <span class="pill" id="streakPill" title="أيام متتالية">🔥 0</span>
      <span class="pill" id="xpPill" title="نقاط الخبرة">⭐ 0</span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع"><span class="ico">🌙</span></button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="bottom-nav" id="nav">
    <button data-view="home" class="active"><span>🏠</span>الرئيسية</button>
    <button data-view="challenges"><span>🎯</span>التحديات</button>
    <button data-view="focus"><span>⏱️</span>تركيز</button>
    <button data-view="cards"><span>🗂️</span>بطاقاتي</button>
    <button data-view="games"><span>🧠</span>ألعاب</button>
    <button data-view="journey"><span>🗺️</span>رحلتي</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
