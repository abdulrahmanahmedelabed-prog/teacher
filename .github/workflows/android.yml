# يبني تطبيق Android (APK) من نفس كود الويب باستخدام Capacitor
# وينشره في صفحة Releases برابط تحميل ثابت
name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" $MANIFEST || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $MANIFEST
          grep -q "android.speech.RecognitionService" $MANIFEST || \
            sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n</manifest>#' $MANIFEST
          grep -n "permission\|queries\|RecognitionService" $MANIFEST
      - name: Apply app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/android/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher.png
            cp resources/android/mipmap-$d/ic_launcher_round.png $RES/mipmap-$d/ic_launcher_round.png
          done
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rehla-alawda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rehla-alawda-apk
          path: rehla-alawda.apk
      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rehla-alawda.apk \
            --target "$GITHUB_SHA" \
            --title "رحلة العودة — أحدث نسخة Android" \
            --notes "ثبّت الملف rehla-alawda.apk على موبايلك (قد تحتاج تفعيل «التثبيت من مصادر غير معروفة»). بُني من الكومت $GITHUB_SHA."
